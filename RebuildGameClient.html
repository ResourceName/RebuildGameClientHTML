<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Rebuild</title>
		<style>
html, body, #canvas {
    margin: 0;
    padding: 0;
    border: 0;
    width: 100%;
    height: 100%;
}

html, body {
    background: white;
    overflow: hidden;
    touch-action: none;
}

#canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
}

#canvas:focus {
    outline: none;
}

body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
}

/* Your existing elements */
#rebuildlogo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 256px;
    height: auto;
    z-index: 20;
    pointer-events: none;
}

#status, #status-splash, #status-progress {
    position: absolute;
    left: 0;
    right: 0;
}

#status, #status-splash {
    top: 0;
    bottom: 0;
}

#status {
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    visibility: hidden;
}

#status-splash {
    max-height: 100%;
    max-width: 100%;
    margin: auto;
}

#status-splash.show-image--false {
    display: none;
}

#status-splash.fullsize--true {
    height: 100%;
    width: 100%;
    object-fit: contain;
}

#status-splash.use-filter--false {
    image-rendering: pixelated;
}

#status-progress, #status-notice {
    display: none;
}

#status-progress {
    bottom: 10%;
    width: 50%;
    margin: 0 auto;
}

#status-notice::before {
    content: "";
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;   
    height: 24px;
    background-image: url("resources/error.png");
    background-size: contain;
    background-repeat: no-repeat;
}

#status-notice {
    background: linear-gradient(to bottom, #7a2f2f, #3a1a1a);
    border: none;
    border-radius: 0;
    color: #e0e0e0;
    font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
    line-height: 1.3;
    margin: 0 2rem;
    overflow: hidden;
    padding: 1rem 1rem 1rem 3.5rem;
    text-align: left;
    position: relative;
    z-index: 1;
}

#loading-gif {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 64px;
    height: auto;
    pointer-events: none;
    z-index: 10;
}

@keyframes fadeout {
    from { opacity: 1; }
    to { opacity: 0; }
}

@keyframes fadebg {
    from { background-color: white; }
    to { background-color: transparent; }
}

.fade-out {
    animation: fadeout 1s ease forwards;
}

.fade-bg {
    animation: fadebg 1s ease forwards;
}




</style>

</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag. Please upgrade your browser to play Rebuild.
		</canvas>

		<noscript>
			Your browser does not support JavaScript. Please enable JavaScript or upgrade your browser to play Rebuild.
		</noscript>
		
		<img id="rebuildlogo" src="resources/rebuild.png" alt="">
		<img id="loading-gif" src="resources/load.gif" alt="Loading">

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--false" src="RebuildGameClient.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="RebuildGameClient.js"></script>
		<script>


async function gdextensiontest(displayFailureNotice) {
    const release = "libluagdextension.web.template_release.wasm32.nothreads.wasm";
    const debug = "libluagdextension.web.template_debug.wasm32.nothreads.wasm";

    async function exists(url) {
        try {
            const res = await fetch(url, { method: "HEAD" });
            return res.ok;
        } catch (_) {
            return false;
        }
    }

    if (await exists(release)) {
        return release;
    }
    if (await exists(debug)) {
        return debug;
    }

    throw new Error(
        "Missing GDExtension WASM files:\n" +
        release + "\n" +
        debug
    );
}

// const GODOT_THREADS_ENABLED = false;
// const engine = new Engine(GODOT_CONFIG);

async function gdextensiontest() {
    const release = "libluagdextension.web.template_release.wasm32.nothreads.wasm";
    const debug = "libluagdextension.web.template_debug.wasm32.nothreads.wasm";

    async function exists(url) {
        try {
            const res = await fetch(url, { method: "HEAD" });
            return res.ok;
        } catch (_) {
            return false;
        }
    }

    if (await exists(release)) {
        return release;
    }
    if (await exists(debug)) {
        return debug;
    }

    throw new Error(
        "Missing GDExtension WASM files:\n" +
        release + "\n" +
        debug
    );
}

const GODOT_CONFIG = {
    "args": [],
    "canvasResizePolicy": 2,
    "emscriptenPoolSize": 8,
    "ensureCrossOriginIsolationHeaders": true,
    "executable": "https://github.com/ResourceName/RebuildGameClientHTML/releases/download/arby/RebuildGameClient", // do here later!
    "experimentalVK": false,
    "fileSizes": {
        "RebuildGameClient.pck": 92717160,
        "RebuildGameClient.wasm": 1509558
    },
    "focusCanvas": true,
    "gdextensionLibs": [], // ← we will fill this dynamically
    "godotPoolSize": 4
};

const GODOT_THREADS_ENABLED = false;

(async function () {

    const statusOverlay = document.getElementById('status');
    const statusProgress = document.getElementById('status-progress');
    const statusNotice = document.getElementById('status-notice');

    let initializing = true;
    let statusMode = '';

    let gdext;
    try {
        gdext = await gdextensiontest();
        GODOT_CONFIG.gdextensionLibs = [gdext];
    } catch (err) {
        displayFailureNotice(err);
        return;
    }
    const engine = new Engine(GODOT_CONFIG);

    function setStatusMode(mode) {
        if (statusMode === mode || !initializing) {
            return;
        }
        if (mode === 'hidden') {
            statusOverlay.remove();
            initializing = false;
            return;
        }
        statusOverlay.style.visibility = 'visible';
        statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
        statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
        statusMode = mode;
    }

    function setStatusNotice(text) {
        while (statusNotice.lastChild) {
            statusNotice.removeChild(statusNotice.lastChild);
        }
        const lines = text.split('\n');
        lines.forEach((line) => {
            statusNotice.appendChild(document.createTextNode(line));
            statusNotice.appendChild(document.createElement('br'));
        });
    }

    function displayFailureNotice(err) {
        console.error(err);
        document.getElementById('rebuildlogo').style.display = 'none';
        setStatusNotice("Failed to launch Rebuild.  Please check the console for more details.");
        setStatusMode('notice');
        initializing = false;
    }

    const missing = Engine.getMissingFeatures({
        threads: GODOT_THREADS_ENABLED,
    });

    if (missing.length !== 0) {
        const missingMsg = 'Error\nThe following features required to run Rebuild on the Web are missing:\n';
        displayFailureNotice(missingMsg + missing.join('\n'));
    } else {
        engine.startGame({
            onProgress: function (current, total) {
                if (current > 0 && total > 0) {
                    statusProgress.value = current;
                    statusProgress.max = total;
                } else {
                    statusProgress.removeAttribute('value');
                    statusProgress.removeAttribute('max');
                }
            },
        }).then(() => {
            document.getElementById('rebuildlogo').classList.add('fade-out');
            document.getElementById('loading-gif').classList.add('fade-out');
            document.body.classList.add('fade-bg');

            setStatusMode('hidden');
        }, displayFailureNotice);
    }
})();

		</script>
	</body>
